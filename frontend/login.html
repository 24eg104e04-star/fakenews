<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fake News Detection System</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Core & Login Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-badge"><i class="bi bi-shield-check"></i></span>
                <span>FakeNews<span class="text-primary">Detector</span></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-house"></i> Home
                </a>
                <a href="register.html" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-person-plus"></i> Register
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Login Container -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account to analyze news articles</p>
            </div>

            <!-- Demo Credentials Helper Box -->
            <div class="demo-credentials-box">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong class="text-secondary"><i class="bi bi-info-circle me-1"></i>Demo Credentials:</strong>
                    <button type="button" id="fillDemoBtn" class="btn btn-sm btn-link p-0 text-decoration-none" style="font-size: 0.8rem;">
                        <i class="bi bi-magic me-1"></i>Quick Fill
                    </button>
                </div>
                <div>Email: <code>demo@student.com</code></div>
                <div>Password: <code>password123</code></div>
            </div>

            <!-- Dynamic Alert Box -->
            <div id="alertBox" class="alert-custom" style="display: none;" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" id="email" 
                               placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="password" 
                               placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-auth-submit">
                    Login to System <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS & Login Logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
