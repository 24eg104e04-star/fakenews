# ===================================================================
# Fake News Detection System - Production Ready Configuration
# ===================================================================

# Server Port (Supports cloud platform dynamic PORT variable)
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Configuration
# Supports environment variables for Docker, Render, Railway, AWS deployment
# Default: connects to local MySQL, with automatic embedded DB fallback if password is YOUR_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fake_news_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------
# General Configuration
# -------------------------------------------------------------------
spring.main.banner-mode=console
spring.sql.init.mode=never
